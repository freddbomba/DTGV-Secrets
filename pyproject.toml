[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-intake"
version = "0.1.0"
description = "Ingest, encrypt, and file interview audio under globally unique serial IDs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Interview Intake contributors" }]
keywords = ["age", "encryption", "interview", "nextcloud", "research"]
dependencies = []

[project.optional-dependencies]
# Preferred Rust-backed age binding.
pyrage = ["pyrage>=1.1"]
# Useful for reading duration from compressed audio containers.
duration = ["mutagen>=1.45"]
# GUI: Tk is part of the standard library / OS (python3-tk on Linux, bundled
# on macOS), so the base GUI extra installs nothing.
gui = []
# Optional drag-and-drop enhancement for the GUIs.
gui-dnd = ["tkinterdnd2>=0.3"]
# QR codes for key exchange and key backup (pure Python).
qr = ["qrcode>=7.4"]
# Excel export of pro forma data.
excel = ["openpyxl>=3.1"]
# PyInstaller-based standalone app builds.
packaging = ["pyinstaller>=6"]
dev = ["pytest>=7", "pytest-cov>=4", "pyrage>=1.1", "mutagen>=1.45", "openpyxl>=3.1", "qrcode>=7.4", "pyyaml>=6"]

[project.scripts]
interview-intake = "interview_intake.cli:main"
interview-supervisor = "interview_intake.supervisor_cli:main"
pro-forma-to-excel = "interview_intake.proforma:main"

[project.gui-scripts]
interview-intake-gui = "interview_intake.gui:main"
interview-supervisor-gui = "interview_intake.supervisor_gui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
interview_intake = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["interview_intake"]
